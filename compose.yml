services:
  pdm-mcp-server:
    image: jer3m/pdm-mcp-server:latest
    ports:
      - "3000:3000"
    environment:
      PDM_URL: https://pdm.example.com:8443
      PDM_TOKEN_ID: readonly@pdm!mcp
      PDM_TOKEN_SECRET: replace-with-token-secret
      PDM_TLS_INSECURE: "false"
      PDM_TIMEOUT_MS: "60000"
      MCP_PORT: "3000"
      MCP_AUTH_MODE: ${MCP_AUTH_MODE-disabled}
      MCP_JWT_SECRET: ${MCP_JWT_SECRET:-}
      MCP_JWT_AUDIENCE: ${MCP_JWT_AUDIENCE-pdm-mcp}
    restart: unless-stopped
